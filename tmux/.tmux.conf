# ~/.tmux.conf — managed by ~/dotfiles (stow package: tmux)

# remap to use ctrl-a for tmux commands
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using \ and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Vim mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim; y / Enter copy to the system clipboard.
# Clipboard command is OS-dependent: pbcopy on macOS, wl-copy / xclip on Linux.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter
if-shell 'command -v pbcopy >/dev/null' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"'
if-shell 'command -v wl-copy >/dev/null' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"'
if-shell '! command -v pbcopy >/dev/null && ! command -v wl-copy >/dev/null && command -v xclip >/dev/null' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"; bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"'

# Session / window helpers (scripts from ~/dotfiles/bin, stowed into ~/.local/bin)
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r k run-shell "tmux neww ~/.local/bin/tmux-session-picker"
bind-key -r y run-shell "tmux neww ~/.local/bin/tmux-window-opener"
# PR dashboard lives in ~/scripts (laptop only) — bind only when present
if-shell 'test -x ~/scripts/pr-dashboard.sh' \
  'bind-key -r g run-shell "tmux neww ~/scripts/pr-dashboard.sh"'

######################
### DESIGN CHANGES ###
######################

# true colour for nvim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

## Status bar design
set -g status-justify right
set -g status-interval 2

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# The modes {
setw -g clock-mode-colour colour135

set -g status-position top
set -g status-bg colour234
set -g status-fg colour138

set -g base-index 1
# gitmux shows git status of the current pane's directory (brew/GitHub release)
set -g status-left '#[fg=white,bg=colour62,bold] #S #[bg=colour234,bold] #(command -v gitmux >/dev/null && gitmux "#{pane_current_path}")'
set -g status-right ''
set -g status-left-length 100
setw -g window-status-current-format ' #[fg=colour26][#I:#W]'
setw -g window-status-format ' #[fg=colour69][#I:#W]'
